<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dr. Ashwini's Skin, Hair & Cosmetology Clinic | Vijayanagar, Bengaluru</title>
<meta name="description" content="Consult Dr. Ashwini K.R (MBBS, DDVL) at Dr. Ashwini's Skin, Hair & Cosmetology Clinic in Vijayanagar, Bengaluru for clinical dermatology, aesthetic procedures, and advanced laser treatments.">
<meta property="og:title" content="Dr. Ashwini's Skin, Hair & Cosmetology Clinic | Vijayanagar, Bengaluru">
<meta property="og:description" content="Consult Dr. Ashwini K.R (MBBS, DDVL) at Dr. Ashwini's Skin, Hair & Cosmetology Clinic in Vijayanagar, Bengaluru for clinical dermatology, aesthetic procedures, and advanced laser treatments.">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/remixicon@4.3.0/fonts/remixicon.css" rel="stylesheet">

<style>
/* =========================================================
   1. DESIGN TOKENS  (change the brand blue in ONE place)
   ========================================================= */
:root{
  --brand:#1f5bff;          /* accents, links, icons            */
  --brand-dark:#0b2fa8;     /* dark buttons, footer, headings   */
  --brand-mid:#9cb8ff;      /* doctor cards                     */
  --brand-tint:#d3e0ff;     /* hero card, doctors band          */
  --brand-soft:#eef3ff;     /* soft card backgrounds            */

  /* neutrals */
  --ink:#0f1b2d;
  --muted:#4a5568;
  --line:#dfe6f3;
  --white:#fff;
  --warm:#c98d70;
  --lilac:#e6c9f3;

  --radius-xl:24px;
  --radius-lg:18px;
  --radius-md:12px;
  --gap:18px;
  --container:1380px;
  --pad:clamp(14px,3.2vw,40px);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:Outfit,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:#fff;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
ul{list-style:none}
:focus-visible{outline:2px solid var(--brand);outline-offset:3px}
.wrap{max-width:var(--container);margin:0 auto;padding:0 var(--pad)}
section{margin-top:clamp(44px,7vw,100px)}
.h-xl{font-size:clamp(28px,4vw,54px);font-weight:300;line-height:1.14;letter-spacing:-.02em;color:var(--brand-dark)}
.h-lg{font-size:clamp(24px,3.4vw,48px);font-weight:300;line-height:1.15;letter-spacing:-.02em;color:var(--brand-dark)}
.center{text-align:center}
.sub{font-size:clamp(14.5px,1.35vw,18px);line-height:1.65;color:#2b3a55;max-width:660px}
.center .sub{margin:12px auto 0}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 20px;border-radius:10px;font-size:14px;font-weight:500;transition:background .2s,color .2s,border-color .2s,transform .2s;white-space:nowrap}
.btn-dark{background:var(--brand-dark);color:#fff;border:1.5px solid var(--brand-dark)}
.btn-dark:hover{background:var(--brand);border-color:var(--brand)}
.btn-line{background:transparent;color:var(--brand-dark);border:1.5px solid var(--brand)}
.btn-line:hover{background:var(--brand);color:#fff}
.btn-white{background:#fff;color:var(--brand-dark);border:1.5px solid #fff}
.btn-white:hover{background:var(--brand-dark);color:#fff;border-color:var(--brand-dark)}
.btn-wa{background:#25D366;color:#fff;border:1.5px solid #25D366}
.btn-wa:hover{background:#1ebe57;border-color:#1ebe57;color:#fff}
.circ{width:38px;height:38px;border-radius:50%;display:inline-grid;place-items:center;border:1.5px solid var(--brand);color:var(--brand);flex:none;transition:background .2s,color .2s}
.circ.fill,.circ:hover{background:var(--brand-dark);border-color:var(--brand-dark);color:#fff}
.ico{font-size:18px;line-height:1;display:inline-block}
.circ i{font-size:18px}.tool i{font-size:18px}

/* ---------- image slots ---------- */
.img{width:100%;height:100%;object-fit:cover}
.ph{width:100%;height:100%;min-height:80px;display:grid;place-items:center;color:var(--brand);background:linear-gradient(135deg,var(--brand-tint),#f6f9ff 60%,var(--brand-mid));}
.ph i{font-size:34px;opacity:.55}

/* =========================================================
   2. NAVBAR (Mobile-first - Doctor Name Only)
   ========================================================= */
.nav{margin-top:14px;border:1px solid var(--line);border-radius:var(--radius-lg);padding:0 16px;height:64px;display:flex;align-items:center;justify-content:space-between;gap:10px;position:relative;background:#fff;z-index:20}
.logo{display:flex;align-items:center;gap:8px;font-weight:600;font-size:clamp(16px,2vw,21px);color:var(--brand-dark);min-width:0}
.logo span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.logo i{font-size:22px;color:var(--brand);flex:none}
.nav-links{position:absolute;top:calc(100% + 8px);right:0;width:min(290px,100%);background:#fff;border:1px solid var(--line);border-radius:var(--radius-lg);box-shadow:0 24px 48px -28px rgba(11,47,168,.45);flex-direction:column;gap:0;padding:6px 22px;display:none;font-size:15px;color:var(--muted);z-index:30}
.nav-links.open{display:flex}
.nav-links a{position:relative;padding:14px 0;border-bottom:1px solid var(--line);transition:color .2s}
.nav-links a:last-child{border-bottom:0}
.nav-links a:hover,.nav-links a.active{color:var(--brand-dark)}
.nav-links a.active::before{content:"•";margin-right:4px;color:var(--brand)}
.tool{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;position:relative;color:var(--ink);flex:none}
.avatar{width:38px;height:38px;border-radius:50%;overflow:hidden;background:var(--brand-tint)}
.burger{display:grid;cursor:pointer}

/* =========================================================
   3. HERO (Mobile-First Responsive)
   ========================================================= */
.hero{margin-top:14px;display:grid;grid-template-columns:1fr;gap:var(--gap)}
.hero-left{background:var(--brand-tint);border-radius:var(--radius-xl);padding:22px 18px;display:flex;flex-direction:column;justify-content:center;gap:20px}
.pill{display:inline-flex;align-items:center;gap:6px;background:#fff;border-radius:10px;padding:7px 12px;font-size:12px;width:fit-content;max-width:100%;color:var(--brand-dark);flex-wrap:wrap;line-height:1.35}
.pill i{color:var(--brand)}
.hero h1{margin-top:14px;max-width:560px;font-size:clamp(26px,6.2vw,52px);line-height:1.15}
.hero-sub{margin-top:12px;max-width:500px;font-size:14.5px;color:var(--ink);line-height:1.55}
.hero-cta{margin-top:20px;display:grid;grid-template-columns:1fr;gap:10px}
.hero-cta .btn{width:100%;justify-content:center}
.hero-right{position:relative;border-radius:var(--radius-xl);overflow:hidden;min-height:340px;background:var(--brand-tint);display:flex;flex-direction:column;justify-content:flex-end}
.hero-right .img,.hero-right .ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.stats{position:relative;z-index:2;margin:180px 10px 10px;display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.stat{background:rgba(255,255,255,.95);backdrop-filter:blur(8px);border-radius:10px;padding:10px 8px;text-align:center}
.stat b{display:block;font-size:clamp(14px,3.6vw,26px);font-weight:600;color:var(--brand-dark);line-height:1.2}
.stat span{display:block;font-size:11px;color:var(--muted);margin-top:2px;line-height:1.2}

/* =========================================================
   4. SERVICES (tabs + image cards)
   ========================================================= */
.svc-tabs{margin:22px auto 0;display:flex;flex-wrap:wrap;justify-content:center;gap:6px;padding:6px;background:var(--brand-soft);border:1px solid var(--line);border-radius:14px;width:100%;max-width:780px}
.svc-tab{flex:1 1 auto;padding:11px 12px;border-radius:10px;font-size:13px;font-weight:500;color:var(--brand-dark);display:flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;transition:background .2s,color .2s}
.svc-tab small{min-width:22px;height:22px;border-radius:99px;background:#fff;color:var(--brand-dark);font-size:11px;display:grid;place-items:center;padding:0 5px}
.svc-tab:hover{background:#fff}
.svc-tab[aria-selected="true"]{background:var(--brand-dark);color:#fff}
.svc-tab[aria-selected="true"] small{background:rgba(255,255,255,.2);color:#fff}
.svc-grid{margin-top:24px;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:var(--gap)}
.svc{position:relative;display:flex;flex-direction:column;background:#fff;border:1px solid var(--line);border-radius:var(--radius-lg);overflow:hidden;transition:transform .25s,box-shadow .25s,border-color .25s}
.svc:hover{transform:translateY(-4px);border-color:var(--brand);box-shadow:0 18px 40px -22px rgba(11,47,168,.45)}
.svc-media{position:relative;aspect-ratio:4/3;overflow:hidden;background:linear-gradient(110deg,var(--brand-tint) 30%,#f6f9ff 50%,var(--brand-tint) 70%);background-size:220% 100%;animation:shimmer 2.2s linear infinite}
.svc:nth-child(4n+2) .svc-media{background:linear-gradient(135deg,var(--lilac),#f8eefc)}
.svc:nth-child(4n+3) .svc-media{background:linear-gradient(135deg,#ffe0d0,#fff3ec)}
.svc:nth-child(4n+4) .svc-media{background:linear-gradient(135deg,#cdeee5,#eefaf6)}
.svc-media .img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transform:scale(1.04);transition:opacity .6s ease,transform .7s cubic-bezier(.2,.7,.2,1)}
.svc-media .img.loaded{opacity:1;transform:scale(1)}
.svc-media::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 55%,rgba(11,47,168,.28));opacity:0;transition:opacity .4s;pointer-events:none}
.svc:hover .svc-media::after{opacity:1}
.svc:hover .svc-media .img.loaded{transform:scale(1.07)}
.svc-no{position:absolute;top:12px;left:12px;z-index:1;background:rgba(255,255,255,.95);border-radius:99px;padding:4px 12px;font-size:12px;font-weight:500;color:var(--brand-dark)}
.svc-badge{position:absolute;top:12px;right:12px;z-index:1;background:var(--brand-dark);color:#fff;border-radius:99px;padding:4px 10px;font-size:11px;font-weight:500;display:inline-flex;align-items:center;gap:4px}
.svc-body{padding:18px 18px 20px;display:flex;flex-direction:column;gap:8px;flex:1}
.svc-body h3{font-size:18px;font-weight:500;color:var(--brand-dark);line-height:1.28}
.svc-body p{font-size:13.5px;color:var(--muted)}
.svc-body p::first-letter{text-transform:uppercase}
.svc-foot{margin-top:auto;padding-top:14px;display:flex;align-items:center;justify-content:space-between;font-size:13px;font-weight:500;color:var(--brand)}
.svc-foot .circ{width:34px;height:34px}
.svc:hover .svc-foot .circ{background:var(--brand-dark);border-color:var(--brand-dark);color:#fff}
.svc-cta{margin-top:28px;display:flex;justify-content:center;gap:10px;flex-wrap:wrap}

/* =========================================================
   6. FAQ  (questions and answers only)
   ========================================================= */
.faq-list{margin:32px auto 0;max-width:880px;display:grid;gap:12px}
.qa{background:var(--brand-soft);border:1px solid var(--line);border-radius:var(--radius-md);transition:background .2s,border-color .2s}
.qa[open]{background:#fff;border-color:var(--brand)}
.qa summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:16px 18px;font-size:clamp(15px,1.4vw,18.5px);color:var(--brand-dark);font-weight:500}
.qa summary::-webkit-details-marker{display:none}
.qa summary i{flex:none;width:32px;height:32px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:18px;color:var(--brand-dark);transition:transform .25s,background .2s,color .2s}
.qa[open] summary i{transform:rotate(45deg);background:var(--brand-dark);color:#fff}
.qa p{padding:0 18px 18px;font-size:14px;color:var(--muted);max-width:760px}
.faq-foot{margin-top:22px;text-align:center;font-size:14px;color:var(--muted)}
.faq-foot a{color:var(--brand);font-weight:500}

/* =========================================================
   7. DOCTORS  (full profile section - Mobile-first)
   ========================================================= */
.band{background:var(--brand-tint);padding:clamp(40px,6vw,80px) 0}
.band .wrap>.sub{color:var(--ink)}
.dprofiles{margin-top:32px;display:grid;gap:var(--gap)}
.dprof{background:#fff;border-radius:var(--radius-xl);overflow:hidden;display:grid;grid-template-columns:1fr;text-align:left;scroll-margin-top:24px}
.dprof-photo{position:relative;min-height:390px;background:var(--brand-mid)}
.dprof-photo .img,.dprof-photo .ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 15%}
.dprof-tag{position:absolute;left:16px;bottom:16px;background:rgba(255,255,255,.95);backdrop-filter:blur(6px);border-radius:10px;padding:9px 14px;font-size:13px;font-weight:500;color:var(--brand-dark);display:flex;align-items:center;gap:8px;box-shadow:0 8px 24px -8px rgba(11,47,168,.3)}
.dprof-tag i{color:var(--brand);font-size:16px}
.dprof-body{padding:clamp(20px,3.6vw,52px);display:flex;flex-direction:column;justify-content:center;gap:20px}
.dprof-body h3{font-size:clamp(26px,3.2vw,44px);font-weight:300;letter-spacing:-.02em;line-height:1.1;color:var(--brand-dark)}
.dprof-quals{margin-top:6px;font-size:14px;color:var(--muted)}
.dprof-role{margin-top:8px;font-size:15px;font-weight:500;color:var(--brand)}
.dprof-intro{font-size:14.5px;color:var(--ink);max-width:600px}
.dprof h4{font-size:12px;font-weight:600;color:var(--brand-dark);text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px}
.dprof-list{display:grid;gap:10px}
.dprof-list li{display:flex;align-items:flex-start;gap:10px;font-size:14px;color:var(--ink)}
.dprof-list .tick{width:22px;height:22px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;flex:none;margin-top:1px}
.dprof-list .tick i{font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--brand-soft);border:1px solid var(--line);border-radius:99px;padding:6px 14px;font-size:13px;color:var(--brand-dark)}
a.chip:hover{background:var(--brand-dark);color:#fff;border-color:var(--brand-dark)}
.dprof-facts{display:grid;grid-template-columns:1fr;gap:12px}
.fact{background:var(--brand-soft);border-radius:var(--radius-md);padding:14px 16px;font-size:12.5px;color:var(--muted)}
.fact b{display:block;font-size:13.5px;font-weight:500;color:var(--brand-dark);margin-top:2px}
.dprof-cta{display:flex;gap:10px;flex-wrap:wrap}

/* =========================================================
   8. REVIEWS (Mobile-first)
   ========================================================= */
.rev-head{max-width:720px;margin:0 auto;text-align:center}
.rev-head p{margin:12px auto 0;font-size:clamp(14.5px,1.35vw,18px);line-height:1.65;color:#2b3a55;max-width:620px}
.rev-grid{margin-top:30px;display:grid;grid-template-columns:1fr;gap:var(--gap)}
.rev{position:relative;display:flex;flex-direction:column;gap:18px;background:#fff;border:1px solid var(--line);border-radius:var(--radius-lg);padding:22px 20px;transition:transform .3s,box-shadow .3s,border-color .3s}
.rev:hover{transform:translateY(-6px);border-color:var(--brand);box-shadow:0 22px 44px -26px rgba(11,47,168,.5)}
.rev-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.stars{display:flex;gap:3px;color:#f5a623;font-size:19px;line-height:1}
.stars i{display:inline-block;transition:transform .3s}
.rev:hover .stars i{animation:starPop .5s ease both;animation-delay:calc(var(--s)*60ms)}
.rating-num{font-size:13px;font-weight:500;color:var(--brand-dark);background:var(--brand-soft);border-radius:99px;padding:4px 10px}
.rev q{display:block;quotes:none;font-size:clamp(15px,1.35vw,18px);line-height:1.6;color:var(--ink);font-weight:400;flex:1}
.rev-foot{border-top:1px solid var(--line);padding-top:16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.who{display:flex;align-items:center;gap:14px;min-width:0}
.who .avatar{width:50px;height:50px;flex:none;border:3px solid var(--brand-tint);box-shadow:0 0 0 1px var(--brand);display:grid;place-items:center;color:var(--brand-dark);background:var(--brand-tint);font-size:16px;font-weight:500;transition:transform .35s}
.rev:hover .who .avatar{transform:scale(1.08) rotate(-3deg)}
.avatar .img{object-position:center 18%}
.who b{display:block;font-size:15px;font-weight:500;color:var(--brand-dark);line-height:1.25}
.who small{display:inline-block;margin-top:4px;font-size:12px;font-weight:500;color:var(--brand-dark);background:var(--brand-soft);border-radius:99px;padding:3px 10px}
.qmark{font-size:34px;line-height:1;color:var(--brand-mid);flex:none}
.pager{margin-top:26px;display:flex;align-items:center;justify-content:center;gap:16px}
.pager .circ{width:42px;height:42px}
.pager .circ[disabled]{opacity:.35;cursor:default}
.dots{display:flex;gap:8px}
.dots span{width:8px;height:8px;border-radius:99px;background:var(--brand-tint);transition:width .3s,background .3s}
.dots span.on{width:26px;background:var(--brand-dark)}

/* =========================================================
   9. CONTACT / VERTICAL BOOKING & EMBEDDED GOOGLE MAP
   ========================================================= */
.touch{
  position:relative;
  overflow:hidden;
  background:linear-gradient(145deg, #0b2fa8 0%, #1644d6 52%, #1f5bff 100%);
  color:#fff;
  border-radius:var(--radius-xl);
  padding:clamp(28px,5.5vw,68px) var(--pad);
  text-align:center;
  box-shadow:0 32px 64px -28px rgba(11,47,168,.55);
}
.touch::before,.touch::after{
  content:"";
  position:absolute;
  border:32px solid rgba(255,255,255,.08);
  border-radius:50%;
  pointer-events:none;
}
.touch::before{width:520px;height:520px;left:-200px;top:-260px}
.touch::after{width:620px;height:620px;right:-260px;bottom:-340px}
.touch>*{position:relative;z-index:1}
.touch .h-xl{color:#fff}
.faces{margin:22px auto 12px;display:flex;justify-content:center;align-items:center}
.faces .avatar{width:76px;height:76px;border:3px solid #fff;margin-left:-14px;background:var(--brand-mid);box-shadow:0 10px 24px rgba(0,0,0,.22)}
.faces .avatar:nth-child(2){width:94px;height:94px;z-index:1}
.faces .avatar:first-child{margin-left:0}
.touch-cap{font-size:15px;color:#dbe7ff;max-width:560px;margin:0 auto}
.touch-cta{margin-top:18px;display:flex;justify-content:center;gap:10px;flex-wrap:wrap}

/* Vertical Booking Card */
.book-card{
  margin:28px auto 0;
  max-width:540px;
  background:#fff;
  color:var(--ink);
  border-radius:var(--radius-lg);
  padding:clamp(18px,3.5vw,32px);
  text-align:left;
  box-shadow:0 24px 48px -18px rgba(6,20,75,.45);
}
.consult-switch{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  padding:5px;
  background:var(--brand-soft);
  border:1px solid var(--line);
  border-radius:12px;
  margin-bottom:18px;
}
.consult-btn{
  padding:11px 10px;
  border-radius:9px;
  font-size:13px;
  font-weight:500;
  color:var(--brand-dark);
  display:flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  transition:all .2s ease;
  text-align:center;
}
.consult-btn.active{
  background:var(--brand-dark);
  color:#fff;
  box-shadow:0 6px 16px -6px rgba(11,47,168,.5);
}
.form-vertical{
  display:flex;
  flex-direction:column;
  gap:14px;
}
.field-group{
  display:flex;
  flex-direction:column;
  gap:5px;
}
.field-group label{
  font-size:12.5px;
  font-weight:500;
  color:var(--brand-dark);
}
.form-vertical input,
.form-vertical select{
  width:100%;
  padding:13px 14px;
  border:1.5px solid var(--line);
  border-radius:10px;
  font:inherit;
  font-size:14px;
  background:#f9fbff;
  color:var(--ink);
  transition:border-color .2s,box-shadow .2s,background .2s;
}
.form-vertical input:focus,
.form-vertical select:focus{
  outline:none;
  background:#fff;
  border-color:var(--brand);
  box-shadow:0 0 0 4px rgba(31,91,255,.14);
}
.form-vertical .btn-submit{
  width:100%;
  padding:14px 20px;
  font-size:15px;
  margin-top:4px;
}
.form-msg{
  font-size:13.5px;
  min-height:20px;
  color:var(--brand-dark);
  text-align:center;
  font-weight:500;
  margin-top:4px;
}

.details{
  margin:28px auto 0;
  max-width:980px;
  display:grid;
  grid-template-columns:1fr;
  gap:12px;
  text-align:left;
}
.details div{
  background:rgba(255,255,255,.12);
  backdrop-filter:blur(8px);
  border:1px solid rgba(255,255,255,.22);
  border-radius:var(--radius-md);

function renderReviews(){

  const draw=()=>{
    const s=REVIEWS.pageSize, pages=Math.max(1,Math.ceil(REVIEWS.items.length/s));
    revPage=Math.min(Math.max(revPage,0),pages-1);

/* ---------- scroll reveal + progress bar ---------- */
const revealIO = new IntersectionObserver(es=>es.forEach(en=>{
  if(en.isIntersecting){ en.target.classList.add("in"); revealIO.unobserve(en.target); }
}),{threshold:.12,rootMargin:"0px 0px -6% 0px"});
function revealAll(root=document){ root.querySelectorAll(".reveal:not(.in)").forEach(el=>revealIO.observe(el)); }
function tagReveal(){
  const mark=(sel,step=0)=>document.querySelectorAll(sel).forEach((el,i)=>{ el.classList.add("reveal"); if(step) el.style.setProperty("--i",i*step); });
  mark(".hero-left .pill"); mark(".hero-left h1"); mark(".hero-sub"); mark(".hero-cta");
  mark(".hero-right"); mark(".stat",1);
  mark("#services .center > *"); mark("#doctors .wrap > h2"); mark("#doctors .wrap > .sub");
  mark(".dprof"); mark("#faqs .center > *"); mark(".qa",1); mark(".faq-foot");
  mark(".touch"); mark(".foot");
}
const progress=$("#progress");
addEventListener("scroll",()=>{
  const h=document.documentElement; const max=h.scrollHeight-h.clientHeight;
  progress.style.transform="scaleX("+(max>0?h.scrollTop/max:0)+")";
},{passive:true});
